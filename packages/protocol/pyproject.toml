[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-bazaar-protocol"
version = "0.1.0"
description = "Turn-taking negotiation state machine for Agent Bazaar"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_bazaar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
